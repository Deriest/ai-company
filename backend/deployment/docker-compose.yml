# AIC Platform — Docker Compose
version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../aic-platform:/app/aic-platform
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/aic.db
      - SECRET_KEY=${SECRET_KEY:-aic-platform-secret-change-in-production}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
